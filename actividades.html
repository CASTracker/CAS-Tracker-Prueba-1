<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CAS Tracker - Actividades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <h1>Actividades CAS</h1>
      <nav class="nav-inline">
        <a href="menu.html">Inicio</a>
        <a href="actividades.html">Actividades</a>
        <a href="reflexiones.html">Reflexiones</a>
        <a href="horario.html">Horario</a>
      </nav>
    </div>
    <div class="header-right">
      <button id="logoutBtn" class="btn ghost">Cerrar sesión</button>
    </div>
  </header>

  <main class="container">
    <section class="card form-card">
      <form id="formActividad" class="form">
        <div class="row">
          <input type="text" id="nombre" placeholder="Nombre de la actividad" required>
          <select id="categoria" required>
            <option value="">Categoría</option>
            <option value="C">Creatividad</option>
            <option value="A">Actividad</option>
            <option value="S">Servicio</option>
          </select>
        </div>

        <div class="row">
          <input type="number" id="horas" placeholder="Horas" min="1" required>
          <input type="date" id="fecha" required>
        </div>

        <textarea id="descripcion" placeholder="Descripción breve"></textarea>
        <div class="row space-between">
          <button type="submit" class="btn">Guardar Actividad</button>
          <button id="btnLimpiarForm" type="button" class="btn outline">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Lista de Actividades</h2>
      <table id="tablaActividades" class="table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Horas</th>
            <th>Fecha</th>
            <th>Descripción</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer class="site-footer">
    <p>Creado por Alejandro Sánchez Alejo</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
