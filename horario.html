<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CAS Tracker - Horario Semanal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <h1>Horario Semanal CAS</h1>
      <nav class="nav-inline">
        <a href="menu.html">Inicio</a>
        <a href="actividades.html">Actividades</a>
        <a href="reflexiones.html">Reflexiones</a>
        <a href="horario.html">Horario</a>
      </nav>
    </div>
    <div class="header-right">
      <button id="logoutBtn" class="btn ghost">Cerrar sesión</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Organiza tu Semana CAS</h2>
      <table id="tablaHorario" class="table">
        <thead>
          <tr><th>Día</th><th>Actividad Planeada</th></tr>
        </thead>
        <tbody>
          <tr><td>Lunes</td><td contenteditable="true"></td></tr>
          <tr><td>Martes</td><td contenteditable="true"></td></tr>
          <tr><td>Miércoles</td><td contenteditable="true"></td></tr>
          <tr><td>Jueves</td><td contenteditable="true"></td></tr>
          <tr><td>Viernes</td><td contenteditable="true"></td></tr>
          <tr><td>Sábado</td><td contenteditable="true"></td></tr>
          <tr><td>Domingo</td><td contenteditable="true"></td></tr>
        </tbody>
      </table>

      <div class="row space-between">
        <div>
          <button id="guardarHorario" class="btn">Guardar Horario</button>
          <button id="limpiarHorario" class="btn outline">Limpiar</button>
        </div>
        <small class="muted">Los cambios se guardan localmente y se sincronizan con tu cuenta</small>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Creado por Alejandro Sánchez Alejo</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
